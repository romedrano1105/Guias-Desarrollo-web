<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos de cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pedidos.css" />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body>
    <main class="orders-page">
      <h1 class="h2 mb-4">Gestión de pedidos de cafetería</h1>

      <section class="mb-4" aria-labelledby="formularioTitulo">
        <h2 id="formularioTitulo" class="h4">Agregar un pedido</h2>
        <form id="formularioPedido" class="row g-3">
          <div class="col-12 col-md-5">
            <label for="producto" class="form-label">Nombre del producto</label>
            <input
              id="producto"
              name="producto"
              class="form-control"
              type="text"
              maxlength="100"
              autocomplete="off"
              required
            />
          </div>
          <div class="col-12 col-md-3">
            <label for="precio" class="form-label">Precio unitario (USD)</label>
            <input
              id="precio"
              name="precio"
              class="form-control"
              type="number"
              min="0.01"
              step="0.01"
              required
            />
          </div>
          <div class="col-12 col-md-2">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input
              id="cantidad"
              name="cantidad"
              class="form-control"
              type="number"
              min="1"
              step="1"
              required
            />
          </div>
          <div class="col-12 col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">
              Agregar pedido
            </button>
          </div>
        </form>
        <p id="mensajeEstado" class="status-message mt-2" aria-live="polite"></p>
      </section>

      <section class="mb-4" aria-labelledby="filtroTitulo">
        <h2 id="filtroTitulo" class="h4">Filtrar por precio máximo</h2>
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-4">
            <label for="precioMaximo" class="form-label">
              Precio unitario máximo (USD)
            </label>
            <input
              id="precioMaximo"
              class="form-control"
              type="number"
              min="0"
              step="0.01"
            />
          </div>
          <div class="col-auto">
            <button id="btnFiltrar" class="btn btn-outline-primary" type="button">
              Filtrar productos
            </button>
          </div>
          <div class="col-auto">
            <button
              id="btnMostrarTodos"
              class="btn btn-outline-secondary"
              type="button"
            >
              Mostrar todos
            </button>
          </div>
          <div class="col-auto">
            <button id="btnLimpiar" class="btn btn-outline-danger" type="button">
              Limpiar pedidos
            </button>
          </div>
        </div>
      </section>

      <section aria-labelledby="tablaTitulo">
        <h2 id="tablaTitulo" class="h4">Pedidos registrados</h2>
        <div class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead class="table-success">
              <tr>
                <th scope="col">Producto</th>
                <th scope="col">Precio unitario</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Subtotal</th>
              </tr>
            </thead>
            <tbody id="tablaPedidos"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="resumenTitulo" class="mt-3">
        <h2 id="resumenTitulo" class="h4">Resumen de todos los pedidos</h2>
        <p>Unidades solicitadas: <strong id="totalUnidades">0</strong></p>
        <p>Monto total: <strong id="montoTotal">$0.00</strong></p>
      </section>

      <a href="../index.html" class="mt-4">Regresar a los ejemplos</a>
    </main>
  </body>
</html>
